client_id = "9c42d0ad58be67b4236c16d4e2cfd598"
name = "ILM & MRP (prod)"
application_url = "https://india-legal-mrp.onrender.com"
embedded = true

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks"

[[webhooks.subscriptions]]
topics = ["products/create", "products/update", "products/delete"]
